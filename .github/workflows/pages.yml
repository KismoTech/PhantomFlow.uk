name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The engine release in site/js/flow/engine/ is vendored (never edited by hand). Before anything is published, its files
      # must match their manifest (size and SHA-256), nothing unlisted may sit beside them, and the module must ride the
      # reference ride to the digests the manifest records. A mismatch fails the deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify the vendored engine release
        run: node site/js/flow/engine/verify.mjs site/js/flow/engine

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
